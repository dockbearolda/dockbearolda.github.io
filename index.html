<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#ffffff" />
<title>OLDA</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<style>
  :root{
    --duck:#4A6274; --duck-hover:#42596A; --duck-focus:#6B8191;
    --sage:#8BA0AF; --sage-2:#ADB8B9;
    --ink:#202930; --muted:#5b6b78; --muted-2:#7a8893;
    --card-border:rgba(255,255,255,0.7);
    --glass:rgba(255,255,255,.62);
    --shadow:0 1px 2px rgba(32,41,48,.04),0 10px 26px rgba(74,98,116,.10);
    --shadow-hover:0 4px 10px rgba(32,41,48,.06),0 22px 46px rgba(74,98,116,.18);
    --spring:cubic-bezier(.34,1.56,.64,1);
    --radius:22px;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1100px 560px at 50% -12%, rgba(74,98,116,.09), transparent 62%),
      radial-gradient(900px 500px at 110% 115%, rgba(139,160,175,.10), transparent 60%),
      #f4f6f8;
    color:var(--ink);
    font-variant-numeric:tabular-nums; overflow-x:hidden;
  }
  .wrap{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:56px 24px; }

  .bento{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; width:100%; max-width:760px; }
  @media (max-width:760px){ .bento{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .bento{ grid-template-columns:1fr; gap:12px; } }

  .card{
    position:relative; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:14px;
    padding:22px 18px;
    background:var(--glass);
    -webkit-backdrop-filter:blur(14px) saturate(160%); backdrop-filter:blur(14px) saturate(160%);
    border:1px solid var(--card-border); border-radius:var(--radius);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.85);
    text-decoration:none; color:var(--ink); overflow:hidden; isolation:isolate;
    transition:transform .35s var(--spring), box-shadow .3s, border-color .3s;
    opacity:0; transform:translateY(20px); animation:appear .6s var(--spring) forwards;
  }
  /* reflet diagonal qui balaye la carte au survol */
  .card::after{
    content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.5) 48%, transparent 66%);
    transform:translateX(-130%); transition:transform .7s var(--spring);
  }
  .card:hover::after{ transform:translateX(130%); }
  .card:nth-child(1){animation-delay:.04s} .card:nth-child(2){animation-delay:.09s} .card:nth-child(3){animation-delay:.14s} .card:nth-child(4){animation-delay:.19s} .card:nth-child(5){animation-delay:.24s} .card:nth-child(6){animation-delay:.29s} .card:nth-child(7){animation-delay:.34s} .card:nth-child(8){animation-delay:.39s}
  @keyframes appear{ to{ opacity:1; transform:translateY(0); } }
  .card:hover{ transform:translateY(-5px) scale(1.02); box-shadow:var(--shadow-hover), inset 0 1px 0 rgba(255,255,255,.85); border-color:rgba(255,255,255,.9); }
  .card:active{ transform:translateY(-2px) scale(.98); }
  .card:focus-visible{ outline:none; border-color:var(--duck-focus); box-shadow:0 0 0 3px rgba(107,129,145,.22),var(--shadow); }

  .card-icon{
    position:relative; z-index:1;
    width:48px; height:48px; border-radius:15px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    background:linear-gradient(155deg, var(--c-hi,#8ba0af), var(--c-lo,#4a6274));
    box-shadow:0 8px 18px var(--c-glow,rgba(74,98,116,.32)), inset 0 1px 0 rgba(255,255,255,.55), inset 0 0 0 1px rgba(255,255,255,.16);
    transition:transform .35s var(--spring), box-shadow .3s;
  }
  .card-icon::before{ content:""; position:absolute; left:0; right:0; top:0; height:55%; background:linear-gradient(to bottom, rgba(255,255,255,.55), rgba(255,255,255,0)); pointer-events:none; }
  .card:hover .card-icon{
    transform:scale(1.1) translateY(-1px);
    box-shadow:0 14px 28px var(--c-glow,rgba(74,98,116,.44)), inset 0 1px 0 rgba(255,255,255,.7), inset 0 0 0 1px rgba(255,255,255,.28);
  }
  .card-icon svg{ position:relative; z-index:1; width:25px; height:25px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.22)); transition:transform .35s var(--spring); }
  .card:hover .card-icon svg{ transform:scale(1.06); }
  .ic-planning{ --c-hi:#5ad1e6; --c-lo:#0aa6c9; --c-glow:rgba(10,166,201,.38); }
  .ic-b2c{ --c-hi:#4aa3ff; --c-lo:#0a5cff; --c-glow:rgba(10,92,255,.35); }
  .ic-b2b{ --c-hi:#8f83ff; --c-lo:#4b3fd6; --c-glow:rgba(75,63,214,.35); }
  .ic-dtf{ --c-hi:#ff7db3; --c-lo:#e0247e; --c-glow:rgba(224,36,126,.35); }
  .ic-devis{ --c-hi:#ffc04d; --c-lo:#ff7a00; --c-glow:rgba(255,122,0,.38); }
  .ic-bat{ --c-hi:#4fd98a; --c-lo:#12a651; --c-glow:rgba(18,166,81,.35); }
  .ic-logo{ --c-hi:#b982ff; --c-lo:#7a2fd6; --c-glow:rgba(122,47,214,.35); }
  .ic-fiverr{ --c-hi:#43e0a0; --c-lo:#12a15e; --c-glow:rgba(18,161,94,.35); }
  .card-name{ font-size:15px; font-weight:600; letter-spacing:-.005em; color:var(--duck); transition:color .3s; }
  .card:hover .card-name{ color:var(--duck-hover); }

  /* Accès protégés — cartes normales colorées (ouvrent la modale mot de passe) */
  button.card{ -webkit-appearance:none; appearance:none; font-family:inherit; text-align:left; width:100%; cursor:pointer; }
  .bento + .bento{ margin-top:16px; }
  .ic-catalogue{ --c-hi:#ff8a6b; --c-lo:#e5372b; --c-glow:rgba(229,55,43,.35); }
  .ic-design2{ --c-hi:#f48be0; --c-lo:#c112a6; --c-glow:rgba(193,18,166,.35); }
  .ic-chiffrage{ --c-hi:#ffd15c; --c-lo:#e39a12; --c-glow:rgba(227,154,18,.38); }
  .ic-heures{ --c-hi:#2fd4c4; --c-lo:#0a9d92; --c-glow:rgba(10,157,146,.35); }
  .ic-clients{ --c-hi:#6aa6ff; --c-lo:#2f5fe0; --c-glow:rgba(47,95,224,.34); }
  .ic-fiche{ --c-hi:#b07bff; --c-lo:#6d28d9; --c-glow:rgba(109,40,217,.35); }

  /* Modale d'accès par mot de passe */
  .lock-overlay{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    padding:24px; padding-bottom:calc(24px + env(safe-area-inset-bottom));
    background:rgba(32,41,48,.34);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    animation:overlayIn .25s ease forwards;
  }
  .lock-overlay[hidden]{ display:none; }
  @keyframes overlayIn{ from{opacity:0} to{opacity:1} }
  .lock-card{
    width:100%; max-width:340px;
    background:var(--glass);
    -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%);
    border:1px solid var(--card-border); border-radius:var(--radius);
    box-shadow:var(--shadow-hover); padding:26px 22px 22px;
    display:flex; flex-direction:column; align-items:center; gap:16px;
    transform:translateY(8px) scale(.98); opacity:0;
    animation:cardIn .35s var(--spring) forwards;
  }
  @keyframes cardIn{ to{ transform:translateY(0) scale(1); opacity:1; } }
  .lock-badge{
    width:54px; height:54px; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#1a1d21,#000);
    box-shadow:0 10px 22px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .lock-badge svg{ width:26px; height:26px; stroke:#fff; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  #lockForm{ width:100%; display:flex; flex-direction:column; gap:12px; }
  #lockInput{
    width:100%; height:48px; padding:0 14px;
    font-size:16px; color:var(--ink); font-family:inherit;
    background:rgba(255,255,255,.7); border:1px solid rgba(255,255,255,.8); border-radius:13px;
    outline:none; transition:border-color .2s, box-shadow .2s;
  }
  #lockInput:focus{ border-color:var(--duck-focus); box-shadow:0 0 0 3px rgba(107,129,145,.18); }
  #lockInput.shake{ animation:shake .4s; border-color:#c0392b; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
  .lock-actions{ display:flex; gap:10px; }
  .lock-btn{
    flex:1; min-height:46px; border-radius:13px; font-size:15px; font-weight:600; font-family:inherit;
    cursor:pointer; border:1px solid transparent;
    -webkit-appearance:none; appearance:none; transition:transform .15s, background .2s, border-color .2s;
  }
  .lock-btn:active{ transform:scale(.97); }
  .lock-btn--ghost{ background:rgba(255,255,255,.7); color:var(--muted); border-color:rgba(255,255,255,.8); }
  .lock-btn--go{ background:linear-gradient(150deg,#1a1d21,#000); color:#fff; }
  .lock-error{ font-size:13px; color:#c0392b; text-align:center; margin-top:2px; }
  .lock-error[hidden]{ display:none; }
  footer{ margin-top:40px; color:var(--muted-2); font-size:12px; text-align:center; }
</style>
</head>

      <div class="lock-actions">
        <button type="button" class="lock-btn lock-btn--ghost" id="lockCancel">Annuler</button>
        <button type="submit" class="lock-btn lock-btn--go">Entrer</button>

    </form>

<script>
  document.getElementById('y').textContent = new Date().getFullYear();

  (function(){
    // Accès protégé : l'URL de destination de chaque tuile est chiffrée (AES-GCM,
    // clé dérivée du mot de passe par PBKDF2) dans l'attribut data-enc.
    // Ni le mot de passe ni les URLs n'apparaissent en clair dans la source.
    // Seul le bon mot de passe déchiffre l'URL de la tuile cliquée et l'ouvre.
    var ITER    = 150000;
    var overlay = document.getElementById('lockOverlay');
    var input   = document.getElementById('lockInput');
    var errorEl = document.getElementById('lockError');
    var form    = document.getElementById('lockForm');
    var cancel  = document.getElementById('lockCancel');
    var tiles   = document.querySelectorAll('[data-enc]');
    var encStr  = null;

    function openLock(enc){
      encStr = enc;
      errorEl.hidden = true;
      input.value = '';
      input.classList.remove('shake');
      overlay.hidden = false;
      setTimeout(function(){ input.focus(); }, 60);
    }
    function closeLock(){ overlay.hidden = true; encStr = null; }

    function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
    async function decryptUrl(enc, pw){
      var parts = enc.split('.');           // salt.iv.ciphertext (base64)
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      var key  = await crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:b64(parts[0]), iterations:ITER, hash:'SHA-256'},
        base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(parts[1])}, key, b64(parts[2]));
      return new TextDecoder().decode(pt);
    }

    Array.prototype.forEach.call(tiles, function(t){
      t.addEventListener('click', function(){ openLock(t.getAttribute('data-enc')); });
    });
    cancel.addEventListener('click', closeLock);
    overlay.addEventListener('click', function(e){ if(e.target === overlay) closeLock(); });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !overlay.hidden) closeLock(); });

    form.addEventListener('submit', async function(e){
      e.preventDefault();
      var dest = null;
      if(encStr){ try { dest = await decryptUrl(encStr, input.value); } catch(_){ dest = null; } }
      if(dest){
        closeLock();
        window.location.href = dest;
      } else {
        errorEl.hidden = false;
        input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake');
        input.select();
      }
    });
  })();
</script>
